<!DOCTYPE html>
<html>
<head>
<title>root@van-ai:~#</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
body {
    background: #0a0a0a;
    color: #00ff41;
    font-family: 'Share Tech Mono', monospace;
    margin: 0;
    padding: 20px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.header {
    border-bottom: 2px solid #00ff41;
    padding-bottom: 10px;
    margin-bottom: 20px;
    font-size: 18px;
    text-shadow: 0 0 10px #00ff41;
    letter-spacing: 1px;
}

.chat-container {
    flex: 1;
    background: #000;
    border: 2px solid #00ff41;
    box-shadow: 0 0 20px #00ff41;
    padding: 15px;
    overflow-y: auto;
    border-radius: 5px;
    margin-bottom: 15px;
    width: 100%;
}

.msg {
    padding: 12px;
    margin: 8px 0;
    border-radius: 3px;
    line-height: 1.6;
    word-wrap: break-word;
    animation: typeIn 0.2s;
}

@keyframes typeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

.user-msg {
    background: #003300;
    border-left: 3px solid #00ff41;
    text-align: right;
}

.ai-msg {
    background: #001100;
    border-left: 3px solid #00ff41;
}

.input-area {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    background: #000;
    color: #00ff41;
    border: 2px solid #00ff41;
    padding: 14px;
    font-family: 'Share Tech Mono';
    font-size: 16px;
    outline: none;
    border-radius: 3px;
}

input:focus {
    box-shadow: 0 0 15px #00ff41;
}

button {
    background: #00ff41;
    color: #000;
    border: none;
    padding: 14px 25px;
    font-family: 'Share Tech Mono';
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    border-radius: 3px;
    transition: 0.2s;
}

button:hover {
    box-shadow: 0 0 25px #00ff41;
    background: #00ff88;
}

::placeholder {
    color: #00aa30;
}

::-webkit-scrollbar {
    width: 8px;
}
::-webkit-scrollbar-track {
    background: #000;
}
::-webkit-scrollbar-thumb {
    background: #00ff41;
    box-shadow: 0 0 5px #00ff41;
}
</style>
</head>
<body>
    <div class="header">root@van-ai:~# Admin - Mistral AI [ONLINE]</div>
    
    <div class="chat-container" id="chat">
        <div class="msg ai-msg">van-ai@root:~$ Sistem online. Siap menerima perintah.</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="root@van-ai:~$ ketik perintah..." autocomplete="off">
        <button onclick="sendMsg()">EXECUTE</button>
    </div>

<script>
function sendMsg() {
    let input = document.getElementById('msgInput');
    let chat = document.getElementById('chat');
    let msg = input.value;
    
    if(msg.trim() === '') return;
    
    chat.innerHTML += `<div class="msg user-msg">root@van-ai:~$ ${msg}</div>`;
    input.value = '';
    chat.scrollTop = chat.scrollHeight;
    
    chat.innerHTML += `<div class="msg ai-msg" id="loading">van-ai@root:~$ processing<span id="dots">...</span></div>`;
    chat.scrollTop = chat.scrollHeight;
    
    fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: msg})
    })
    .then(r => r.json())
    .then(data => {
        document.getElementById('loading').remove();
        chat.innerHTML += `<div class="msg ai-msg">van-ai@root:~$ ${data.reply}</div>`;
        chat.scrollTop = chat.scrollHeight;
    });
}

document.getElementById('msgInput').addEventListener('keypress', function(e) {
    if(e.key === 'Enter') sendMsg();
});
</script>
</body>
</html>
